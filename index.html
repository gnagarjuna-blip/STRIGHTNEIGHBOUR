<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Neighbor Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: #2d2d2d;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #c5a059;
        }

        h2 { text-align: center; color: #c5a059; text-transform: uppercase; }

        /* Mock Roulette Table Style */
        .roulette-board {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 5px;
            background: #004d26;
            padding: 15px;
            border-radius: 10px;
            border: 5px solid #5d4037;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            font-weight: bold;
            font-size: 0.9em;
        }

        .red { background-color: #e63946; }
        .black { background-color: #000000; }
        .green { background-color: #2b9348; grid-row: span 3; }

        /* Inputs */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        textarea, input {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #3d3d3d;
            color: white;
            font-size: 1rem;
        }

        button {
            padding: 12px;
            background: #c5a059;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #e2be7a; }

        /* Results */
        .results {
            margin-top: 20px;
            padding: 15px;
            background: #252525;
            border-left: 5px solid #c5a059;
        }

        .prediction {
            font-size: 1.5rem;
            color: #00ff88;
            font-weight: bold;
        }

        .highlight { color: #ffcc00; }
    </style>
</head>
<body>

<div class="container">
    <h2>Roulette Intelligence</h2>

    <div class="roulette-board" id="board">
        <div class="cell green">0</div>
        </div>

    <div class="input-section">
        <label>Step 1: Paste History (Space separated)</label>
        <textarea id="historyInput" rows="3" placeholder="Example: 22 12 13 24 1 28 10 25 12 13 17 19 29"></textarea>

        <label>Step 2: Enter Number to Search</label>
        <input type="number" id="targetNumber" placeholder="e.g. 12">
        
        <button onclick="analyzeNeighbors()">Analyze & Predict</button>
    </div>

    <div class="results" id="output">
        <div>Neighbors Found: <span id="neighborList" class="highlight">-</span></div>
        <div>Prediction: <span id="predictionResult" class="prediction">None</span></div>
    </div>
</div>

<script>
    // Build the visual board numbers
    const board = document.getElementById('board');
    const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    for(let i=1; i<=36; i++) {
        const div = document.createElement('div');
        div.className = `cell ${reds.includes(i) ? 'red' : 'black'}`;
        div.innerText = i;
        board.appendChild(div);
    }

    function analyzeNeighbors() {
        const historyStr = document.getElementById('historyInput').value.trim();
        const target = document.getElementById('targetNumber').value.trim();
        const outputList = document.getElementById('neighborList');
        const outputPred = document.getElementById('predictionResult');

        if (!historyStr || !target) {
            alert("Please provide both history and a target number.");
            return;
        }

        // Convert history string to array of numbers
        const history = historyStr.split(/\s+/);
        let neighbors = [];

        // Loop through history to find target
        for (let i = 0; i < history.length; i++) {
            if (history[i] === target) {
                // Get Left (if exists)
                if (i > 0) neighbors.push(history[i - 1]);
                // Get Right (if exists)
                if (i < history.length - 1) neighbors.push(history[i + 1]);
            }
        }

        // Display neighbors
        outputList.innerText = neighbors.length > 0 ? neighbors.join(", ") : "No neighbors found";

        // Logic for Most Frequent (Prediction)
        if (neighbors.length === 0) {
            outputPred.innerText = "None";
            return;
        }

        const counts = {};
        let maxCount = 0;
        let prediction = [];

        neighbors.forEach(num => {
            counts[num] = (counts[num] || 0) + 1;
            if (counts[num] > maxCount) {
                maxCount = counts[num];
            }
        });

        // Only predict if count > 1
        if (maxCount > 1) {
            for (let num in counts) {
                if (counts[num] === maxCount) prediction.push(num);
            }
            outputPred.innerText = prediction.join(", ");
        } else {
            outputPred.innerText = "None (No repeats)";
        }
    }
</script>

</body>
</html>
