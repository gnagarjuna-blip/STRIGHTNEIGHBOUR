<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Roulette Tracker</title>
    <style>
        :root {
            --gold: #c5a059;
            --green: #064e3b;
            --red: #be123c;
            --black: #111827;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--gold);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            max-width: 900px;
        }

        /* Roulette Table Layout */
        .roulette-wrapper {
            display: flex;
            margin: 20px 0;
            user-select: none;
        }

        .zero-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            background-color: #059669;
            border: 2px solid white;
            border-radius: 40px 0 0 40px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(12, 60px);
            grid-template-rows: repeat(3, 50px);
            border: 1px solid white;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .cell:active { transform: scale(0.9); }
        .red { background-color: var(--red); }
        .black { background-color: var(--black); }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #0f172a;
            color: #00ff88;
            border: 1px solid var(--gold);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-process {
            background: #10b981;
        }

        .btn-clear {
            background: #ef4444;
        }

        .stats-box {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--gold);
        }

        .prediction-tag {
            font-size: 2.5rem;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; color: var(--gold); margin-top: 0;">ROULETTE ANALYZER</h1>

    <div class="roulette-wrapper">
        <div class="zero-container" onclick="addNumber(0)">0</div>
        <div class="numbers-grid" id="grid"></div>
    </div>

    <div class="controls">
        <div>
            <label style="display: block; margin-bottom: 5px;">History (Paste or Click Table):</label>
            <textarea id="historyData" placeholder="History will appear here..."></textarea>
            <div class="button-group">
                <button class="btn btn-process" onclick="calculate()">Analyze Data</button>
                <button class="btn btn-clear" onclick="clearHistory()">Clear Data</button>
            </div>
        </div>

        <div class="stats-box">
            <label>Current Entry to Analyze:</label>
            <input type="number" id="targetNum" style="width: 50px; padding: 5px;" oninput="calculate()">
            <hr style="border: 0.5px solid #444;">
            <div>Neighbors: <span id="neighborDisplay">-</span></div>
            <div>Predicted Outcome:</div>
            <span class="prediction-tag" id="predictionDisplay">--</span>
        </div>
    </div>
</div>

<script>
    const grid = document.getElementById('grid');
    const historyInput = document.getElementById('historyData');
    const targetInput = document.getElementById('targetNum');
    
    const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    
    for (let col = 0; col < 12; col++) {
        for (let row = 3; row >= 1; row--) {
            let num = (col * 3) + row;
            let div = document.createElement('div');
            div.className = `cell ${reds.includes(num) ? 'red' : 'black'}`;
            div.style.gridRow = 4 - row;
            div.style.gridColumn = col + 1;
            div.innerText = num;
            div.onclick = () => addNumber(num);
            grid.appendChild(div);
        }
    }

    function addNumber(n) {
        let current = historyInput.value.trim();
        historyInput.value = current ? current + " " + n : n;
        targetInput.value = n; // Set the clicked number as the search target
        calculate();
    }

    function clearHistory() {
        historyInput.value = "";
        calculate();
    }

    function calculate() {
        const history = historyInput.value.trim().split(/\s+/);
        const target = targetInput.value;
        const neighborDisplay = document.getElementById('neighborDisplay');
        const predDisplay = document.getElementById('predictionDisplay');

        if (!target || history.length < 2 || historyInput.value.trim() === "") {
            neighborDisplay.innerText = "-";
            predDisplay.innerText = "--";
            return;
        }

        let neighbors = [];
        for (let i = 0; i < history.length; i++) {
            if (history[i] === target) {
                if (i > 0) neighbors.push(history[i-1]);
                if (i < history.length - 1) neighbors.push(history[i+1]);
            }
        }

        neighborDisplay.innerText = neighbors.length > 0 ? neighbors.join(", ") : "None";

        // Frequency Logic
        const counts = {};
        let topNum = null;
        let maxCount = 0;

        neighbors.forEach(n => {
            counts[n] = (counts[n] || 0) + 1;
            if (counts[n] > maxCount) {
                maxCount = counts[n];
                topNum = n;
            }
        });

        // Show prediction only if it appears more than once
        if (maxCount > 1) {
            predDisplay.innerText = topNum;
        } else {
            predDisplay.innerText = "NO DATA";
        }
    }
</script>

</body>
</html>
